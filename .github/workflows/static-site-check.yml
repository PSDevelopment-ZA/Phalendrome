name: Static site check

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test